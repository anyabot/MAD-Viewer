name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect site
        run: |
          mkdir out
          cat > out/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <title>MAD Viewer has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://mad.altterisk.cc/">
          <meta http-equiv="refresh" content="0; url=https://mad.altterisk.cc/">
          <script>
            var p = location.pathname.replace(/^\/MAD-Viewer/, '') || '/';
            location.replace('https://mad.altterisk.cc' + p + location.search + location.hash);
          </script>
          <p>Moved to <a href="https://mad.altterisk.cc/">mad.altterisk.cc</a>.</p>
          EOF
          cp out/index.html out/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
